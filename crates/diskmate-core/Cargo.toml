[package]
name = "diskmate-core"
description = "DiskMate storage, system-inspection and indexing engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "diskmate_core"
path = "src/lib.rs"
# The library has no benchmarks of its own; without this `cargo bench` hands the
# harness's arguments to the unit-test binary instead.
bench = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Bundled so DiskMate never depends on the host's SQLite build. `backup` powers
# snapshot export; `functions`/`limits` are not needed and stay off.
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
crossbeam-channel = "0.5"
libc = "0.2"
# Moving to the Trash correctly is not a rename: it needs the volume's own
# .Trashes, collision handling and the Put Back metadata that lets a person
# undo it. This is the one place DiskMate will not reimplement the platform.
trash = "5"
# Duplicate detection hashes file contents. BLAKE3 is fast enough that the
# full-hash stage is not the bottleneck the size and partial stages exist to
# avoid.
blake3 = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# Read-only property-list parsing for LaunchAgents/LaunchDaemons inspection.
plist = { version = "1.7", default-features = false }

[dev-dependencies]
# Used by the benchmark harness as well as the tests.
tempfile = "3"

[[bench]]
name = "scan_bench"
harness = false


[features]
default = []
