[package]
name = "diskmate-core"
description = "DiskMate storage, system-inspection and indexing engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "diskmate_core"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Bundled so DiskMate never depends on the host's SQLite build. `backup` powers
# snapshot export; `functions`/`limits` are not needed and stay off.
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
crossbeam-channel = "0.5"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Read-only property-list parsing for LaunchAgents/LaunchDaemons inspection.
plist = { version = "1.7", default-features = false }

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "scan_bench"
harness = false

[features]
default = []
